<!DOCTYPE html>

<title>Senela PEB Quotation Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>:root{box-sizing:border-box;--bg:#eceef2;--card:#fff;--tx:#141b26;--mut:#647084;--bd:#dde1e8;--ac:#1f4e79;--br:#b8893a;--sb:#0f1c2e;--sb2:#a9b6c9;--in:#f6f7f9;--sh:0 1px 2px rgba(15,28,46,.05),0 8px 24px -12px rgba(15,28,46,.18)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b121d;--card:#131e2e;--tx:#e8edf5;--mut:#8b98ad;--bd:#233248;--ac:#5a9bd5;--sb:#08101b;--in:#0e1826;--sh:0 8px 24px -12px #000}}
:root[data-theme="dark"]{--bg:#0b121d;--card:#131e2e;--tx:#e8edf5;--mut:#8b98ad;--bd:#233248;--ac:#5a9bd5;--sb:#08101b;--in:#0e1826;--sh:0 8px 24px -12px #000}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 'Manrope',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.nav{position:fixed;inset:0 0 auto 0;height:64px;z-index:30;display:flex;align-items:center;gap:14px;padding:0 20px 0 0;background:color-mix(in srgb,var(--card) 86%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.brand{width:264px;height:100%;display:flex;align-items:center;gap:12px;padding:0 22px;background:var(--sb);color:#fff;font-weight:800;font-size:16px;letter-spacing:.2px;flex:none}
.mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#d9a84e,#8a6d2b);display:grid;place-items:center;box-shadow:0 4px 12px -4px #d9a84e}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sb2);letter-spacing:.3px;margin-top:-2px}
.ttl{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ttl span{color:var(--mut);font-weight:500}
.sp{flex:1}
.tot{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;padding-right:6px}.tot small{font-size:11px;color:var(--mut);font-weight:600}.tot b{font-size:18px;font-weight:800;color:var(--ac);font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:10px;padding:10px 18px;font:700 13.5px 'Manrope',system-ui,sans-serif;background:linear-gradient(180deg,#2a6199,#1f4e79);color:#fff;cursor:pointer;box-shadow:0 6px 16px -8px #1f4e79,inset 0 1px 0 #ffffff30;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px)}.btn.g2{background:linear-gradient(180deg,#1f9a55,#15803d);box-shadow:0 6px 16px -8px #15803d,inset 0 1px 0 #ffffff30}.btn:disabled{opacity:.6;cursor:wait;transform:none}
.btn:focus-visible,.f input:focus-visible,.sb a:focus-visible,.burger:focus-visible{outline:2px solid var(--br);outline-offset:2px}
.burger{display:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;width:40px;height:40px;cursor:pointer;font-size:18px}
.sb{position:fixed;top:64px;bottom:0;left:0;width:264px;background:var(--sb);padding:18px 14px;overflow-y:auto;z-index:20;transition:transform .25s}
.sb h4{margin:6px 12px 10px;font-size:11.5px;color:#6f7f96;font-weight:700;letter-spacing:.4px}
.sb a{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:2px;border-radius:10px;color:var(--sb2);text-decoration:none;font-weight:600;font-size:13.5px;cursor:pointer;transition:background .15s,color .15s}
.sb a i{width:8px;height:8px;border-radius:50%;background:#33445c;flex:none;transition:.15s}
.sb a:hover{background:#ffffff0d;color:#fff}
.sb a.on{background:linear-gradient(90deg,#d9a84e26,transparent);color:#fff;box-shadow:inset 3px 0 0 #d9a84e}.sb a.on i{background:#d9a84e;box-shadow:0 0 0 4px #d9a84e30}
.sbf{margin:20px 12px 0;padding-top:16px;border-top:1px solid #ffffff14;font-size:12px;color:#6f7f96}
.main{margin:64px 0 0 264px;padding:28px clamp(16px,3vw,44px) 60px}.wrap{max-width:1000px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px 24px 24px;margin-bottom:20px;box-shadow:var(--sh);scroll-margin-top:84px}
.card h2{font-size:16px;font-weight:800;margin:0 0 18px;padding-bottom:12px;color:var(--tx);display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bd);position:relative}
.card h2:after{content:"";position:absolute;left:0;bottom:-1px;width:44px;height:2px;background:var(--br)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px 18px}
.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--mut)}
.f input{font:500 14px 'Manrope',system-ui,sans-serif;padding:11px 13px;border:1px solid var(--bd);border-radius:10px;background:var(--in);color:var(--tx);width:100%;transition:border-color .15s,box-shadow .15s,background .15s}
.f input:hover{border-color:#b6bfcc}.f input:focus{outline:0;border-color:var(--ac);background:var(--card);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 18%,transparent)}
.f input[type=file]{padding:8px;font-size:13px}
.sum{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding:16px 20px;border-radius:12px;background:linear-gradient(120deg,var(--sb),#1b3554);color:#fff;font-weight:600}.sum b{font-size:22px;font-weight:800;color:#f0c874;font-variant-numeric:tabular-nums}
.msg{color:var(--mut);margin:0 0 14px;min-height:20px;font-weight:600}
.pvh{display:flex;align-items:center;justify-content:space-between;margin:8px 0 14px}.pvh h3{margin:0;font-size:16px;font-weight:800}
.pv{overflow-x:auto;padding:22px;border-radius:16px;background:repeating-linear-gradient(45deg,#0000 0 10px,#00000006 10px 20px),color-mix(in srgb,var(--bg) 60%,#8a94a6);border:1px solid var(--bd)}
.scrim{display:none}
@media (max-width:900px){.burger{display:block;margin-left:12px}.brand{width:auto;background:none;color:var(--tx);padding:0 0 0 4px}.brand small{display:none}.ttl,.tot small{display:none}
.sb{transform:translateX(-100%);width:280px}.sb.open{transform:none;box-shadow:20px 0 40px #0006}.main{margin-left:0;padding:22px 14px 50px}.scrim.open{display:block;position:fixed;inset:64px 0 0;background:#0007;z-index:15}.btn{padding:9px 12px}}
@media (max-width:560px){.nav{gap:8px;padding-right:10px}.brand span{display:none}.btn.hide{display:none}.card{padding:18px 16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* A4 pages 794x1123 px, always white */
.page,.meas{font:13px Calibri,Carlito,Arial,sans-serif;color:#000}
.page{width:794px;height:1123px;background:#fff;position:relative;overflow:hidden;margin:0 auto 14px;box-shadow:0 1px 6px #0004}
.hd{position:absolute;left:30px;right:30px;top:20px;height:78px;display:flex;align-items:center;gap:14px;border-bottom:2px solid #8a6d2b}
.hd img{height:64px;width:auto;max-width:200px;object-fit:contain;display:block;margin-bottom:4px}
.cn{color:#a5713a;font-size:20px;letter-spacing:1px}
.bd{position:absolute;left:30px;top:102px;background:#e0b878;color:#fff;font-size:11px;padding:1px 14px;border-radius:4px}
.rd{position:absolute;left:30px;right:30px;top:122px;display:flex;justify-content:space-between}
.body{position:absolute;left:40px;right:40px;top:150px;bottom:98px;overflow:hidden}
.body.meas{left:-9999px;top:0;right:auto;bottom:auto;width:714px;height:auto;overflow:visible;visibility:hidden}
.blk{display:flow-root}
.ft{position:absolute;bottom:0;left:0;right:0;height:88px;display:flex;align-items:center;gap:16px;padding:0 24px;font-size:10.5px;line-height:1.45}
.ft img{height:56px;width:auto}
.sh{display:inline-block;background:#ffff00;font-size:15px;margin:10px 0 6px}
.blk p{margin:6px 0;line-height:1.45;text-align:justify}
table.t{border-collapse:collapse;table-layout:fixed;width:100%;margin:0;font-size:12px}
.t td{border:1px solid #000;border-top:0;padding:2px 6px;text-align:left;font-weight:400;overflow-wrap:anywhere}
.t.first td{border-top:1px solid #000}
.t .bn,.t .hh td{background:#1f4e79;color:#fff;text-align:center}
.cvw{position:absolute;top:100px;bottom:88px;left:0;right:0;display:flex;flex-direction:column}
.cvt{background:linear-gradient(#3b86d1,#7db6ec);color:#fff;font:700 54px Arial;text-align:center;padding:24px 0}
.cvb{background:#0d2b55;color:#fff;text-align:center;padding:16px;font-size:26px;letter-spacing:1px}
.cvi{flex:1;min-height:0;background:linear-gradient(#a9d3f5,#dfe9f1 60%,#c9ccd0);display:flex;align-items:center;justify-content:center;color:#5b6b7b}
.cvi img{width:100%;height:100%;object-fit:cover}
.ctr{text-align:center}
#exp{position:absolute;left:-10000px;top:0;width:794px}#exp .page{margin:0;box-shadow:none}
.f select{font:500 14px 'Manrope',system-ui,sans-serif;padding:11px 13px;border:1px solid var(--bd);border-radius:10px;background:var(--in);color:var(--tx);width:100%}
.f select:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 18%,transparent)}
.f input:disabled{opacity:.55;cursor:not-allowed}
.tg{margin-left:auto;position:relative;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:700;color:var(--mut)}
.tg input{position:absolute;opacity:0;width:0;height:0}
.tg .sl{width:46px;height:25px;border-radius:99px;background:#9aa5b5;position:relative;transition:.2s;flex:none}
.tg .sl:after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px #0004}
.tg input:checked+.sl{background:#15803d}.tg input:checked+.sl:after{transform:translateX(21px)}
.tg input:focus-visible+.sl{outline:2px solid var(--br);outline-offset:2px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.reqbox{grid-column:1/-1;border:1px solid #d8dee8;border-radius:14px;padding:16px;background:linear-gradient(145deg,#ffffff,#f5f7fb);box-shadow:0 8px 24px -16px rgba(15,28,46,.35)}
.reqhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.reqhead b{font-size:13px;color:var(--tx)}.reqhead span{font-size:11px;color:var(--mut);font-weight:600}
.reqgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.reqitem{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid #e0e5ed;border-radius:11px;background:#fff;cursor:pointer;transition:.15s;box-shadow:0 3px 10px -8px #0f1c2e}.reqitem:hover{border-color:#b7c3d4;transform:translateY(-1px)}
.reqitem.on{border-color:#b8893a;background:linear-gradient(135deg,#fffaf0,#fff);box-shadow:0 6px 18px -12px #b8893a}.reqitem input{width:17px;height:17px;accent-color:#1f4e79;flex:none}.reqitem strong{font-size:12px;color:var(--tx)}
.reqcustom{display:flex;gap:8px;margin-top:12px}.reqcustom input{flex:1;font:500 13px 'Manrope',system-ui,sans-serif;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:#fff;color:var(--tx)}
.reqcustom button{border:0;border-radius:10px;padding:10px 15px;background:linear-gradient(180deg,#d9a84e,#a6783a);color:#fff;font:700 12px 'Manrope',system-ui,sans-serif;cursor:pointer;box-shadow:0 6px 14px -9px #a6783a}
.reqcustom button:hover{transform:translateY(-1px)}
.reqcustomlist{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.reqtag{padding:6px 9px;border-radius:999px;background:#edf4fb;border:1px solid #cddceb;color:#1f4e79;font-size:11px;font-weight:700}
.attachbox{grid-column:1/-1;margin-top:18px;border:1px dashed #b8893a;border-radius:14px;padding:16px;background:linear-gradient(135deg,#fffdf7,#f8fafc)}.attachbox b{display:block;font-size:13px;margin-bottom:4px}.attachbox small{display:block;color:var(--mut);font-size:11px;margin-bottom:10px}.attachbtn{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;background:linear-gradient(180deg,#2a6199,#1f4e79);color:#fff;font-weight:700;font-size:12px;cursor:pointer;box-shadow:0 6px 16px -9px #1f4e79}.attachbtn input{display:none}.attachlist{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.attachtag{padding:6px 9px;border-radius:8px;background:#fff;border:1px solid #dfe4ec;color:#475569;font-size:11px;font-weight:600}
.attachment-page .body{top:155px;bottom:100px;left:34px;right:34px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff;border:0px solid #d9dee6;border-radius:2px;padding:10px;box-sizing:border-box}.attachment-page .attimg{width:100%;height:100%;object-fit:contain;display:block}.attachment-page .attlabel{position:absolute;left:34px;right:34px;bottom:96px;text-align:center;font:600 10px Calibri,Arial,sans-serif;color:#647084;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.attachment-page .bd{left:34px;top:102px;background:#1f4e79;font-size:11px;padding:4px 13px;border-radius:4px;letter-spacing:.2px}.attachment-page .rd{left:34px;right:34px;top:132px;font-size:10.5px;color:#475569}.attachment-page .ft{background:#fff}
@media(max-width:560px){.reqcustom{flex-direction:column}.reqcustom button{width:100%}}
.bld{margin-top:22px;border:1px solid var(--bd);border-radius:16px;padding:18px;background:linear-gradient(145deg,var(--card),var(--in));box-shadow:0 8px 24px -16px rgba(15,28,46,.35)}
.bldhead{display:flex;align-items:center;gap:12px;margin-bottom:16px;grid-column:1/-1;padding-bottom:12px;border-bottom:1px solid var(--bd)}.bldhead b{font-size:14.5px;color:var(--tx)}.bldhead .sp{flex:1}
.bldno{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,#d9a84e,#8a6d2b);color:#fff;font-weight:800;font-size:14px;flex:none}
.bldrm{border:1px solid #e9b8b3;background:#fff5f4;color:#b42318;border-radius:9px;padding:7px 14px;font:700 12.5px 'Manrope',system-ui,sans-serif;cursor:pointer;transition:.15s}.bldrm:hover{background:#fee4e2}
.bldamt{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding:12px 16px;border-radius:12px;background:var(--card);border:1px solid var(--bd);font-weight:600;color:var(--mut)}.bldamt b{font-size:17px;font-weight:800;color:var(--ac)}
.addbld{display:block;width:100%;margin-top:20px;padding:13px;border:1.5px dashed var(--ac);border-radius:12px;background:transparent;color:var(--ac);font:700 13.5px 'Manrope',system-ui,sans-serif;cursor:pointer;transition:.15s}.addbld:hover{background:var(--in)}
@media (max-width:600px){.bld{padding:14px}.bldhead{flex-wrap:wrap}}
.reqhead>div>span{display:block;margin-top:3px;font-weight:500}.reqhead>span{white-space:nowrap;background:var(--in);border:1px solid var(--bd);padding:3px 10px;border-radius:99px}
.reqcustom{flex-wrap:wrap}.reqcustom input{flex:1 1 180px;min-width:0}.reqcustom button{flex:none;white-space:nowrap}
.bld .reqbox{margin-top:18px}.bld .reqgrid{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
</style></head>
